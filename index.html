<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#482074">
  <meta name="description" content="Explore food manufacturing careers with FutureBite. Discover engineering roles, take the career quiz and step inside our interactive factory tour.">
  <title>FutureBite | Food Manufacturing Careers</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="header"></header><main id="main" tabindex="-1"></main><footer id="footer"></footer>
  <dialog id="modal" aria-labelledby="modal-title"><button class="modal-close" type="button" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="notice">Please enable JavaScript to use the career quiz and interactive pages.</p></noscript>
  <!-- Static definitions allow Netlify to detect the forms rendered by JavaScript. -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="form-name" value="contact"><input name="bot-field"><input name="name"><input name="email" type="email"><input name="subject"><input name="reason"><textarea name="message"></textarea><input name="consent">
  </form>
  <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="form-name" value="newsletter"><input name="bot-field"><input name="email" type="email"><input name="consent">
  </form>
</body>
</html>
